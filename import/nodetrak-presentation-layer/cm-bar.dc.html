<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px">
<span style="font-size:14px;font-weight:700;line-height:1.5">{{ label }}</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:400;letter-spacing:.02em;margin-left:auto">{{ value }}</span>
</div>
<div style="height:6px;border-radius:999px;background:#f1f1f1;overflow:hidden">
<div style="{{ fill }}"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:70},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Row label&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pct&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:60,&quot;min&quot;:0,&quot;max&quot;:100,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;accent&quot;,&quot;black&quot;],&quot;default&quot;:&quot;accent&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const pct = Math.max(0, Math.min(100, Number(this.props.pct != null ? this.props.pct : 0)));
    const tone = this.props.tone === 'black' ? '#000' : '#1bbd94';
    return {
      label: this.props.label || '',
      value: this.props.value != null && this.props.value !== '' ? this.props.value : pct + '%',
      fill: 'width:' + pct + '%;height:100%;border-radius:999px;background:' + tone
    };
  }
}
</script>
</body>
</html>
