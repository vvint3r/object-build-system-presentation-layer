<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:10px;align-items:center">
<div aria-hidden="true" style="width:16px;height:3px;background:#1bbd94;border-radius:999px"></div>
<h3 style="margin:0;font-size:24px;font-weight:700;line-height:1.3;letter-spacing:-.01em">{{ title }}</h3>
<div></div>
<div style="margin-top:16px">{{ children }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:160},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sub-block title&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { title: this.props.title || '' }; }
}
</script>
</body>
</html>
