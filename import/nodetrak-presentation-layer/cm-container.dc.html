<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ box }}">{{ children }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:180},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;card&quot;,&quot;hairline&quot;,&quot;primary&quot;,&quot;float&quot;,&quot;canvas&quot;,&quot;emphasis&quot;,&quot;reserved&quot;,&quot;tile&quot;],&quot;default&quot;:&quot;card&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pad&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:28,&quot;min&quot;:0,&quot;max&quot;:48,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
const V = {
  card:     'background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.08)',
  hairline: 'background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.08)',
  primary:  'background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.08)',
  float:    'background:#fff;border-radius:14px;box-shadow:0 14px 28px -6px rgba(0,0,0,.11)',
  canvas:   'background:#fff;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)',
  emphasis: 'background:#fff;border:1.5px solid #000;border-radius:14px;box-shadow:6px 6px 0 rgba(0,0,0,.08)',
  reserved: 'background:#fff;border:1.5px solid #000;border-radius:14px;box-shadow:5px 5px 0 #1bbd94',
  tile:     'background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)'
};
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'card';
    const pad = this.props.pad != null ? this.props.pad : (v === 'primary' || v === 'reserved' ? 32 : 28);
    return { box: (V[v] || V.card) + ';padding:' + pad + 'px' };
  }
}
</script>
</body>
</html>
