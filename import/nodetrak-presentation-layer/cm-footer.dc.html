<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Footer" style="max-width:1060px;margin:0 auto;padding:96px 24px 100px">
<div style="display:flex;align-items:center;gap:12px;row-gap:8px;flex-wrap:wrap;padding-top:20px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.02em;text-transform:uppercase">
<span style="font-weight:700">content-morphia</span>
<span style="font-weight:400">{{ page }}</span>
<span style="margin-left:auto;display:flex;align-items:center;gap:14px;row-gap:8px;flex-wrap:wrap">
<sc-for list="{{ links }}" as="l" hint-placeholder-count="1">
<a href="{{ l.href }}" style="font-weight:600;text-decoration:underline;text-decoration-color:#1bbd94;text-decoration-thickness:1.5px;text-underline-offset:3px">{{ l.label }}</a>
</sc-for>
</span>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:140},&quot;page&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Page name&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;links&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;[]&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    let raw = [];
    try { raw = JSON.parse(this.props.links || '[]'); } catch (e) { raw = []; }
    return {
      page: this.props.page || '',
      links: raw.map(r => ({ label: Array.isArray(r) ? r[0] : r.label, href: Array.isArray(r) ? r[1] : r.href }))
    };
  }
}
</script>
</body>
</html>
