<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Masthead" style="{{ frame }}">
<sc-if value="{{ hasCrumbs }}" hint-placeholder-val="{{ false }}">
<nav aria-label="Breadcrumb" style="display:flex;align-items:center;gap:12px;row-gap:8px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:400;letter-spacing:.02em;text-transform:uppercase;margin-bottom:32px;padding-left:48px">
<sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="3">
<sc-if value="{{ c.link }}" hint-placeholder-val="{{ true }}">
<a href="{{ c.href }}" style="text-decoration:underline;text-decoration-color:#1bbd94;text-decoration-thickness:1.5px;text-underline-offset:3px">{{ c.label }}</a>
</sc-if>
<sc-if value="{{ c.current }}" hint-placeholder-val="{{ false }}">
<span aria-current="page" style="font-weight:700">{{ c.label }}</span>
</sc-if>
<sc-if value="{{ c.sep }}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="font-weight:300">/</span>
</sc-if>
</sc-for>
</nav>
</sc-if>
<div style="display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:12px;align-items:center">
<div aria-hidden="true" style="width:16px;height:16px;box-sizing:border-box;background:#fff;border:3px solid #000;border-radius:999px"></div>
<h1 style="margin:0;font-weight:900;font-size:44px;line-height:1.15;letter-spacing:-.01em">{{ title }}</h1>
<div></div>
<div style="margin-top:24px">{{ children }}</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:260},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Page title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumbs&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;[]&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    let raw = [];
    try { raw = JSON.parse(this.props.crumbs || '[]'); } catch (e) { raw = []; }
    const crumbs = raw.map((r, i) => {
      const label = Array.isArray(r) ? r[0] : r.label;
      const href = Array.isArray(r) ? r[1] : r.href;
      return { label, href, link: !!href, current: !href, sep: i < raw.length - 1 };
    });
    return {
      crumbs, hasCrumbs: crumbs.length > 0,
      title: this.props.title || '',
      frame: 'max-width:1060px;margin:0 auto;padding:' +
        (this.props.padTop != null ? this.props.padTop : 48) + 'px 24px 0'
    };
  }
}
</script>
</body>
</html>
