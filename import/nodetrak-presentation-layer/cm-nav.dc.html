<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,400&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
[data-nav-group] [data-nav-menu]{display:none}
[data-nav-group]:hover [data-nav-menu],[data-nav-group]:focus-within [data-nav-menu]{display:block}
@media(max-width:1040px){#cm-nav-links{flex:1 1 100%!important}}
</style>
</helmet>
<div style="position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)">
<div style="max-width:1060px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:18px;row-gap:10px;flex-wrap:wrap">
<span style="font-weight:900;font-size:16px;letter-spacing:.01em">content-morphia</span>
<sc-if value="{{ hasChip }}" hint-placeholder-val="{{ true }}">
<span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid #000;background:#fff">{{ chip }}</span>
</sc-if>
<nav id="cm-nav-links" aria-label="Design system" style="display:flex;align-items:center;gap:4px;row-gap:6px;flex-wrap:wrap">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
<div data-nav-group="" style="position:relative">
<a href="{{ g.href }}" aria-current="{{ g.aria }}" style="{{ g.pill }}" style-hover="{{ g.pillHover }}">{{ g.name }}</a>
<div data-nav-menu="" style="position:absolute;left:0;top:100%;padding-top:7px;z-index:60;min-width:216px">
<div style="background:#fff;border:1px solid #000;border-radius:14px;box-shadow:0 14px 28px -6px rgba(0,0,0,.11);padding:8px;max-height:62vh;overflow:auto">
<sc-for list="{{ g.pages }}" as="p" hint-placeholder-count="4">
<sc-if value="{{ p.here }}" hint-placeholder-val="{{ false }}">
<span aria-current="page" style="display:block;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:700;background:#f1f1f1">{{ p.label }}</span>
</sc-if>
<sc-if value="{{ p.away }}" hint-placeholder-val="{{ true }}">
<a href="{{ p.href }}" style="display:block;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:400;text-decoration:underline;text-decoration-color:#1bbd94;text-decoration-thickness:1.5px;text-underline-offset:3px" style-hover="background:rgba(27,189,148,.3)">{{ p.label }}</a>
</sc-if>
</sc-for>
</div>
</div>
</div>
</sc-for>
</nav>
<sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ false }}">
<span style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;background:#000;color:#fff;border-radius:999px;padding:4px 10px">{{ badge }}</span>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:120},&quot;page&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Foundations.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Location&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Location&quot;}}">
const P = 'content-morphia ';
const GROUPS = [
  ['Foundations', [
    ['Foundations', 'Foundations.dc.html'],
    ['Icons', 'Icons.dc.html'],
    ['Print', 'Print.dc.html'],
    ['Non-visual equivalents', 'Equivalents.dc.html']]],
  ['Components', [
    ['Structured components', 'Structured.dc.html'],
    ['Prose primitives', 'Prose.dc.html'],
    ['Wayfinding', 'Wayfinding.dc.html'],
    ['Provenance', 'Provenance.dc.html'],
    ['Charts', 'Charts.dc.html'],
    ['Interaction', 'Interaction.dc.html'],
    ['Learning', 'Learning.dc.html'],
    ['Questions and answers', 'Questions.dc.html'],
    ['Change and status', 'Change.dc.html']]],
  ['Diagrams', [
    ['Diagram library', 'Diagrams.dc.html'],
    ['Diagrams at scale', 'Diagrams at Scale.dc.html'],
    ['Technical families', 'Diagrams II.dc.html'],
    ['Experience and magnitude', 'Diagrams III.dc.html'],
    ['Structure and notation', 'Diagrams IV.dc.html']]],
  ['Templates', [
    ['Template index', 'Templates.dc.html'],
    ['T1 Topic', 'T1 Topic.dc.html'],
    ['T2 Framework', 'T2 Framework.dc.html'],
    ['T3 Process', 'T3 Process.dc.html'],
    ['T4 Guide', 'T4 Guide.dc.html'],
    ['T5 Module', 'T5 Module.dc.html'],
    ['T6 Metric', 'T6 Metric.dc.html'],
    ['T7 Comparison', 'T7 Comparison.dc.html'],
    ['T8 Roadmap', 'T8 Roadmap.dc.html'],
    ['T9 Reference', 'T9 Reference.dc.html'],
    ['T10 Glossary', 'T10 Glossary.dc.html'],
    ['T11 Case study', 'T11 Case study.dc.html']]],
  ['Composition', [
    ['Composition', 'Composition.dc.html'],
    ['Anatomy and primitives', 'Anatomy.dc.html'],
    ['Selection', 'Selection.dc.html'],
    ['Implementing', 'Implementing.dc.html'],
    ['Worked example', 'Exemplar.dc.html']]]
];
const MONO = "font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;text-decoration:none;display:block;border-radius:999px;";
class Component extends DCLogic {
  renderVals() {
    const here = this.props.page || '';
    return {
      badge: this.props.badge || '',
      hasBadge: !!this.props.badge,
      chip: this.props.chip || '',
      hasChip: !!this.props.chip,
      groups: GROUPS.map(([name, pages]) => {
        const mine = pages.some(p => p[1] === here);
        return {
          name, aria: mine ? 'page' : 'false',
          href: P + pages[0][1],
          pill: MONO + (mine
            ? 'padding:4px 9px;background:#fff;border:1px solid #000;box-shadow:2px 2px 0 #1bbd94'
            : 'padding:5px 10px'),
          pillHover: mine ? '' : 'background:rgba(27,189,148,.3)',
          pages: pages.map(([label, file]) => ({
            label, href: P + file,
            here: file === here, away: file !== here
          }))
        };
      })
    };
  }
}
</script>
</body>
</html>
