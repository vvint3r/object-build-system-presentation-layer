  <style>
    :root {
      --primary: #17171c;
      --black: #000000;
      --ink: #212121;
      --deep-green: #003c33;
      --dark-navy: #071829;
      --canvas: #ffffff;
      --soft-stone: #eeece7;
      --pale-green: #edfce9;
      --pale-blue: #f1f5ff;
      --hairline: #d9d9dd;
      --border-light: #e5e7eb;
      --card-border: #f2f2f2;
      --muted: #93939f;
      --slate: #75758a;
      --body-muted: #616161;
      --action-blue: #1863dc;
      --focus-blue: #4c6ee6;
      --coral: #ff7759;
      --coral-soft: #ffad9b;
      --form-focus: #9b60aa;
      --error: #b30000;
      --font-display: "Space Grotesk", "CohereText", ui-sans-serif, system-ui, sans-serif;
      --font-body: "Space Grotesk", "Unica77 Cohere Web", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "Space Mono", "CohereMono", monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0;
    }
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: 72px;
      padding: 0 48px;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(14px);
    }
    .nav-brand { font: 500 16px/1 var(--font-body); color: var(--ink); }
    .nav-links {
      display: flex;
      gap: 30px;
      margin: 0;
      padding: 0;
      list-style: none;
      font: 400 14px/1.4 var(--font-body);
    }
    .nav-links a { color: var(--ink); text-decoration: none; }
    .nav-cta {
      border: 0;
      border-radius: 32px;
      background: var(--primary);
      color: #fff;
      padding: 12px 24px;
      font: 500 14px/1.71 var(--font-body);
    }
    .hero {
      padding: 84px 40px 72px;
      background: var(--canvas);
    }
    .hero-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 42px;
      text-align: center;
    }
    h1 {
      margin: 0;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: clamp(54px, 8vw, 96px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -1.92px;
    }
    .hero-copy {
      margin: 18px auto 0;
      max-width: 670px;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.4;
    }
    .hero-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      margin-top: 30px;
    }
    .btn-primary, .btn-light {
      border: 0;
      border-radius: 32px;
      background: var(--primary);
      color: #fff;
      padding: 12px 24px;
      font: 500 14px/1.71 var(--font-body);
    }
    .btn-secondary {
      border: 0;
      border-bottom: 1px solid currentColor;
      background: transparent;
      color: var(--ink);
      padding: 8px 0;
      font: 400 16px/1.5 var(--font-body);
    }
    .hero-media {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-top: 30px;
      text-align: left;
    }
    .media-card {
      min-height: 330px;
      border-radius: 22px;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 15%, rgba(255,119,89,.45), transparent 23%),
        radial-gradient(circle at 78% 22%, rgba(24,99,220,.38), transparent 26%),
        linear-gradient(135deg, #15151b 0%, #514066 46%, #dad6c9 100%);
      display: grid;
      place-items: center;
      padding: 42px;
    }
    .agent-console {
      width: min(620px, 100%);
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      padding: 28px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.08);
    }
    .console-title { display: flex; align-items: center; gap: 12px; font-size: 24px; line-height: 1.3; }
    .console-mark { width: 46px; height: 46px; border-radius: 4px; background: #fff; color: var(--primary); display: grid; place-items: center; }
    .status-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0; }
    .status-chip { border: 1px solid #2f2f37; border-radius: 4px; padding: 8px 11px; color: #d9d9dd; font: 400 12px/1.4 var(--font-mono); text-transform: uppercase; }
    .console-input { display: flex; justify-content: space-between; gap: 12px; border: 1px solid #2f2f37; border-radius: 4px; padding: 18px; color: #fff; }
    .photo-card {
      min-height: 330px;
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.32)),
        radial-gradient(circle at 70% 20%, #ffad9b, transparent 28%),
        linear-gradient(135deg, #f4ddc8, #2f746b 55%, #14171c);
    }
    main { max-width: 1180px; margin: 0 auto; padding: 0 40px 80px; }
    section { padding: 74px 0; border-top: 1px solid var(--card-border); }
    h2 { margin: 0 0 12px; font-size: 48px; font-weight: 400; line-height: 1.2; letter-spacing: -0.48px; }
    h3 { margin: 34px 0 16px; font-size: 24px; font-weight: 400; line-height: 1.3; }
    .section-note { max-width: 760px; margin: 0 0 28px; color: var(--body-muted); }
    .label { font: 400 14px/1.4 var(--font-mono); letter-spacing: .28px; text-transform: uppercase; color: var(--slate); }
    .swatch-grid, .type-grid, .button-grid, .card-grid, .component-grid, .quick-grid, .form-grid {
      display: grid;
      gap: 16px;
    }
    .swatch-grid { grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); }
    .swatch { border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; background: #fff; }
    .swatch-color { height: 84px; border-bottom: 1px solid var(--card-border); }
    .swatch-body { padding: 13px; }
    .swatch-name { display: block; font-size: 14px; }
    .swatch-hex, .swatch-role { display: block; color: var(--body-muted); font-size: 12px; line-height: 1.4; }
    .swatch-role { margin-top: 7px; }
    .type-row {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(260px, 1fr);
      gap: 24px;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid var(--hairline);
    }
    .type-meta { color: var(--body-muted); font-size: 12px; }
    .button-grid, .card-grid, .component-grid, .form-grid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
    .demo-cell {
      min-height: 150px;
      padding: 22px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }
    .outline-pill {
      align-self: flex-start;
      border: 1px solid var(--primary);
      border-radius: 30px;
      background: transparent;
      color: var(--primary);
      padding: 6px 12px;
      font: 500 14px/1.71 var(--font-body);
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .blog-chip { border: 1px solid var(--coral-soft); border-radius: 8px; color: var(--coral); background: #fff8f6; padding: 8px 14px; font-size: 24px; line-height: 1.3; }
    .blog-chip.active { background: var(--coral); color: var(--primary); }
    .media-mini { height: 190px; border-radius: 22px; background: linear-gradient(135deg, var(--dark-navy), #315b78 48%, #e3d5bf); }
    .product-card { border-radius: 8px; background: var(--soft-stone); padding: 32px; min-height: 260px; }
    .product-card hr { border: 0; border-top: 1px solid var(--hairline); margin: 26px 0; }
    .dark-band { grid-column: 1/-1; border-radius: 22px; background: var(--deep-green); color: #fff; padding: 54px; }
    .dark-band-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 32px; }
    .dark-panel { border: 1px solid rgba(255,255,255,.2); border-radius: 16px; min-height: 180px; padding: 28px; background: rgba(255,255,255,.04); }
    .research-table { border-top: 1px solid var(--slate); }
    .research-row { display: grid; grid-template-columns: 1.5fr .8fr 120px; gap: 18px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--slate); }
    .small-pill { display: inline-flex; border: 1px solid var(--primary); border-radius: 30px; padding: 4px 10px; font-size: 14px; margin: 3px; }
    label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--body-muted); }
    input, textarea, select {
      width: 100%;
      border: 1px solid #808080;
      border-radius: 4px;
      background: #fff;
      color: var(--primary);
      padding: 12px;
      font: 400 14px/1.4 var(--font-body);
    }
    textarea { min-height: 92px; resize: vertical; }
    .focus-sample { border-color: var(--form-focus); box-shadow: 0 0 0 2px rgba(209,142,226,.65); }
    .space-row, .radius-row, .elevation-row, .ladder { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; }
    .space-item { display: grid; gap: 8px; justify-items: center; color: var(--body-muted); font-size: 12px; }
    .space-bar { height: 28px; background: var(--primary); border-radius: 4px; }
    .radius-box { width: 118px; height: 82px; display: grid; place-items: center; background: var(--soft-stone); border: 1px solid var(--card-border); text-align: center; color: var(--body-muted); font-size: 12px; }
    .elevation-card { width: 230px; min-height: 128px; padding: 20px; border-radius: 8px; background: #fff; border: 1px solid var(--card-border); }
    .field-dark { background: var(--deep-green); color: #fff; border-color: rgba(255,255,255,.2); }
    table { width: 100%; border-collapse: collapse; border: 1px solid var(--hairline); }
    th, td { padding: 13px 14px; border-bottom: 1px solid var(--hairline); text-align: left; vertical-align: top; font-size: 14px; }
    th { background: var(--soft-stone); font-weight: 400; }
    .device { height: 72px; display: grid; place-items: center; border: 1px solid var(--hairline); border-radius: 8px; color: var(--body-muted); background: #fff; text-align: center; font-size: 12px; }
    .note { margin-top: 18px; padding: 18px; border-radius: 8px; background: var(--soft-stone); color: var(--ink); font-size: 14px; }
    .quick-grid { grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); }
    .quick-chip { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--card-border); border-radius: 8px; padding: 12px; }
    .chip-color { width: 28px; height: 28px; border-radius: 4px; border: 1px solid rgba(0,0,0,.12); }
    .chip-role { display: block; color: var(--body-muted); font: 400 12px/1.4 var(--font-mono); text-transform: uppercase; }
    .chip-name { display: block; }
    .chip-hex { color: var(--body-muted); font-size: 12px; }
    .footer {
      padding: 30px 40px;
      background: var(--primary);
      color: #fff;
      text-align: center;
      font-size: 12px;
    }
    .footer a { color: #fff; }
    @media (max-width: 820px) {
      .nav { padding: 0 48px; grid-template-columns: 1fr !important; gap: 12px; }
      .nav > .nav-left, .nav > .nav-links, .nav > :last-child { justify-self: stretch; }
      .nav-left { justify-content: space-between; }
      .nav-links { justify-content: center; flex-wrap: wrap; gap: 16px; }
      .hero, main { padding-left: 20px; padding-right: 20px; }
      .hero-media, .dark-band-grid, .research-row, .type-row { grid-template-columns: 1fr; }
      .photo-card { min-height: 220px; }
      .dark-band { padding: 28px; }
    }

    /* getdesign.md nav additions */
    .nav-left { display: flex; align-items: center; gap: 20px; }
    .nav-brand-link,
    .nav-brand-link:link,
    .nav-brand-link:visited,
    .nav-brand-link:hover,
    .nav-brand-link:active { text-decoration: none; color: inherit; }
    .nav-github,
    .nav-github:link,
    .nav-github:visited,
    .nav-github:hover,
    .nav-github:active {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: inherit;
      text-decoration: none;
      padding: 5px 10px;
      border: 1px solid rgba(128, 128, 128, 0.3);
      border-radius: 6px;
      opacity: 0.75;
      transition: opacity 200ms ease, border-color 200ms ease;
      font-family: inherit;
      line-height: 1;
      white-space: nowrap;
    }
    .nav-github:hover { opacity: 1; border-color: rgba(128, 128, 128, 0.55); }
    .nav-github svg { display: block; flex-shrink: 0; }

    /* getdesign.md nav centering */
    .nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
    .nav > .nav-left { justify-self: start; }
    .nav > .nav-links { justify-self: center; }
    .nav > :last-child { justify-self: end; }
  

  /* Shared VoltAgent footer content */
  .footer { text-align: left; }
  .footer-shell { max-width: 1200px; margin: 0 auto; }
  .footer-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px; }
  .footer-col h6 { margin: 0 0 14px; color: inherit; font: inherit; font-weight: 700; font-size: 14px; line-height: 1.2; }
  .footer-col span { display: block; margin: 0 0 10px; color: inherit; opacity: 0.72; font-size: 14px; line-height: 1.35; }
  .footer-credit { margin-top: 48px; padding-top: 24px; border-top: 1px solid currentColor; color: inherit; opacity: 0.78; font-size: 13px; line-height: 1.4; }
  .footer-credit a { color: inherit; text-decoration: none; font-weight: 600; }
  .footer-credit img { border-radius: 3px; vertical-align: -2px; margin-right: 3px; }
  @media (max-width: 760px) {
    .footer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
